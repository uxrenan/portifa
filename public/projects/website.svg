<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <!-- Mockup provisório: website institucional no desktop e no celular. Só esqueletos de interface, sem conteúdo real. -->
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#c9d4f5"/><stop offset="1" stop-color="#6f86e6"/></linearGradient>
    <linearGradient id="hero" x2="1" y2="1"><stop stop-color="#3f5fff"/><stop offset="1" stop-color="#8a63d2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#1c2560" flood-opacity=".3"/></filter>
    <clipPath id="win"><rect x="150" y="110" width="1120" height="780" rx="18"/></clipPath>
    <clipPath id="phone"><rect x="1156" y="300" width="270" height="560" rx="34"/></clipPath>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1420" cy="120" r="230" fill="#e1e7fb" opacity=".45"/>
  <g filter="url(#shadow)"><rect x="150" y="110" width="1120" height="780" rx="18" fill="#fafaf8"/></g>
